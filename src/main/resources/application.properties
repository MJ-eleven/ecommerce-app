spring.application.name=ecommerce-app
server.port=8080

# H2 pour le developpement local
spring.datasource.url=jdbc:h2:file:./data/ecommerce_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

spring.devtools.restart.enabled=true

spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=30m

logging.level.com.ecommerce.app=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">À propos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-store"></i> E-Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Produits</a></li>
                <li class="nav-item"><a class="nav-link active" href="/about">À propos</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="text-center">
        <i class="fas fa-store fa-4x text-primary mb-3"></i>
        <h1>À propos de E-Shop</h1>
        <p class="lead">Votre boutique en ligne de confiance</p>
        <hr class="w-50 mx-auto">
    </div>
    <div class="row mt-4">
        <div class="col-12 col-md-4 text-center mb-4">
            <i class="fas fa-truck fa-3x text-primary mb-3"></i>
            <h3>Livraison rapide</h3>
            <p>Livraison sous 24-48h</p>
        </div>
        <div class="col-12 col-md-4 text-center mb-4">
            <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
            <h3>Paiement sécurisé</h3>
            <p>Transactions 100% sécurisées</p>
        </div>
        <div class="col-12 col-md-4 text-center mb-4">
            <i class="fas fa-headset fa-3x text-primary mb-3"></i>
            <h3>Support client</h3>
            <p>Disponible 7j/7</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

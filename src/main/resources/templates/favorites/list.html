<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Mes favoris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-store"></i> E-Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Produits</a></li>
                <li class="nav-item"><a class="nav-link active" href="/favorites"><i class="fas fa-heart text-danger"></i> Favoris</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h1 class="mb-4"><i class="fas fa-heart text-danger"></i> Mes favoris</h1>

    <div th:if="${success}" class="alert alert-success"><span th:text="${success}">Succès</span></div>
    <div th:if="${error}" class="alert alert-danger"><span th:text="${error}">Erreur</span></div>

    <div th:if="${favorites.empty}" class="text-center my-5">
        <i class="fas fa-heart fa-4x text-muted mb-3"></i>
        <p class="lead">Vous n'avez pas encore de favoris</p>
        <a href="/products" class="btn btn-primary"><i class="fas fa-arrow-right"></i> Découvrir les produits</a>
    </div>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3" th:each="product : ${favorites}">
            <div class="card product-card h-100">
                <img th:src="${product.imageUrl}" class="card-img-top" th:alt="${product.name}"
                     onerror="this.src='https://via.placeholder.com/300x200?text=Product'">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Nom</h5>
                    <p class="card-text text-truncate" th:text="${product.description}">Description</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="h5 text-primary" th:text="${currencyService.formatPrice(product.price)}">€0</span>
                        <div>
                            <form th:action="@{/favorites/remove/{id}(id=${product.id})}" method="post" class="d-inline">
                                <input type="hidden" name="redirect" value="/favorites">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Retirer des favoris">
                                    <i class="fas fa-heart-broken"></i>
                                </button>
                            </form>
                            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-sm btn-primary">
                                <i class="fas fa-eye"></i> Voir
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

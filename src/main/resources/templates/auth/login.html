<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - E-Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .login-container { max-width: 400px; margin: 80px auto; }
        .login-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .password-toggle {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #6c757d; background: transparent; border: none; z-index: 10;
        }
        .password-toggle:hover { color: #0d6efd; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 45px; }
        .blocked-message {
            background-color: #f8d7da; border: 1px solid #f5c6cb;
            border-radius: 10px; padding: 20px;
        }
        #blockedMessage { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-container">
        <div class="card login-card">
            <div class="card-header bg-primary text-white text-center py-4">
                <i class="fas fa-store fa-3x"></i>
                <h3 class="mt-2">Connexion</h3>
            </div>
            <div class="card-body p-4">

                <!-- 🔥 MESSAGE DE BLOCAGE (affiché par JavaScript) -->
                <div id="blockedMessage" class="alert alert-danger blocked-message">
                    <div class="text-center">
                        <i class="fas fa-ban fa-3x text-danger mb-3"></i>
                        <h4 class="text-danger fw-bold">⛔ Compte bloqué</h4>
                        <hr>
                        <p id="blockedReason" class="mb-0" style="font-size: 1.1rem;">
                            Votre compte a été bloqué par l'administrateur.
                        </p>
                        <p class="text-muted small mt-3">
                            <i class="fas fa-info-circle"></i> Contactez l'administrateur.
                        </p>
                    </div>
                </div>

                <!-- 🔥 MESSAGE D'ERREUR CLASSIQUE -->
                <div id="errorMessage" class="alert alert-danger" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <strong>Erreur de connexion</strong><br>
                    Nom d'utilisateur ou mot de passe incorrect.
                </div>

                <!-- Message de succès -->
                <div th:if="${param.registered}" class="alert alert-success">
                    <i class="fas fa-check-circle"></i>
                    <strong>Inscription réussie !</strong><br>
                    Connectez-vous maintenant.
                </div>

                <form th:action="@{/login}" method="post" id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">
                            <i class="fas fa-user"></i> Nom d'utilisateur
                        </label>
                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               required
                               placeholder="Entrez votre nom d'utilisateur">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">
                            <i class="fas fa-lock"></i> Mot de passe
                        </label>
                        <div class="password-wrapper">
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   required
                                   placeholder="Entrez votre mot de passe">
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">
                        Pas encore de compte ? <a href="/register" class="text-primary fw-bold">S'inscrire</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const usernameInput = document.getElementById('username');
        const loginForm = document.getElementById('loginForm');
        const blockedMessage = document.getElementById('blockedMessage');
        const errorMessage = document.getElementById('errorMessage');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        // 🔥 VÉRIFIER LE BLOCAGE EN TEMPS RÉEL
        usernameInput.addEventListener('blur', function() {
            const username = this.value.trim();
            if (username.length < 2) return;

            fetch('/api/check-user?username=' + encodeURIComponent(username))
                .then(response => response.json())
                .then(data => {
                    if (data.blocked) {
                        blockedMessage.style.display = 'block';
                        errorMessage.style.display = 'none';
                        document.getElementById('blockedReason').textContent =
                            data.message || 'Votre compte a été bloqué par l\'administrateur.';
                    } else {
                        blockedMessage.style.display = 'none';
                    }
                })
                .catch(error => console.error('Erreur:', error));
        });

        // 🔥 EMPÊCHER LA SOUMISSION SI BLOQUÉ
        loginForm.addEventListener('submit', function(e) {
            const username = usernameInput.value.trim();
            if (username.length < 2) return;

            // Vérifier une dernière fois
            fetch('/api/check-user?username=' + encodeURIComponent(username))
                .then(response => response.json())
                .then(data => {
                    if (data.blocked) {
                        e.preventDefault();
                        blockedMessage.style.display = 'block';
                        errorMessage.style.display = 'none';
                        document.getElementById('blockedReason').textContent =
                            data.message || 'Votre compte a été bloqué par l\'administrateur.';
                    }
                })
                .catch(error => console.error('Erreur:', error));
        });

        // Afficher/masquer le mot de passe
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

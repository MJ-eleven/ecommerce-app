<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Formulaire produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-store"></i> E-Shop Commerçant</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/merchant/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/merchant/products">Mes produits</a></li>
                <li class="nav-item"><a class="nav-link" href="/merchant/categories">Mes catégories</a></li>
                <li class="nav-item"><a class="nav-link" href="/merchant/orders">Commandes</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/logout">Déconnexion</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row">
        <div class="col-12 col-lg-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <span th:if="${product.id == null}">
                            <i class="fas fa-plus"></i> Ajouter un produit
                        </span>
                        <span th:if="${product.id != null}">
                            <i class="fas fa-edit"></i> Modifier le produit
                        </span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="${product.id == null ? '/merchant/products/save' : '/merchant/products/save'}"
                          method="post"
                          th:object="${product}">

                        <input type="hidden" name="id" th:value="${product.id}">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">
                                <i class="fas fa-tag"></i> Nom du produit *
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   name="name"
                                   th:field="*{name}"
                                   required
                                   placeholder="Ex: Smartphone XYZ">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">
                                <i class="fas fa-align-left"></i> Description
                            </label>
                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      th:field="*{description}"
                                      rows="4"
                                      placeholder="Description détaillée du produit"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-12 col-md-6">
                                <div class="mb-3">
                                    <label for="price" class="form-label fw-bold">
                                        <i class="fas fa-money-bill-wave"></i> Prix (FCFA) *
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">CFA</span>
                                        <input type="number"
                                               class="form-control"
                                               id="price"
                                               name="price"
                                               th:field="*{price}"
                                               step="1"
                                               min="0"
                                               required
                                               placeholder="Ex: 1000">
                                    </div>
                                    <small class="text-muted">Entrez le prix en Francs CFA (FCFA)</small>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="mb-3">
                                    <label for="stockQuantity" class="form-label fw-bold">
                                        <i class="fas fa-boxes"></i> Stock *
                                    </label>
                                    <input type="number"
                                           class="form-control"
                                           id="stockQuantity"
                                           name="stockQuantity"
                                           th:field="*{stockQuantity}"
                                           min="0"
                                           required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="categoryId" class="form-label fw-bold">
                                <i class="fas fa-tags"></i> Catégorie *
                            </label>
                            <select class="form-select"
                                    id="categoryId"
                                    name="categoryId"
                                    required>
                                <option value="">Sélectionnez une catégorie</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"
                                        th:selected="${product.category != null && product.category.id == category.id}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="imageUrl" class="form-label fw-bold">
                                <i class="fas fa-image"></i> URL de l'image
                            </label>
                            <input type="url"
                                   class="form-control"
                                   id="imageUrl"
                                   name="imageUrl"
                                   th:field="*{imageUrl}"
                                   placeholder="https://images.unsplash.com/photo-...">
                            <small class="text-muted">
                                <i class="fas fa-info-circle"></i>
                                Utilisez une URL d'image (Unsplash, Imgur, etc.)
                            </small>
                        </div>

                        <div class="mb-3" th:if="${product.imageUrl}">
                            <label class="form-label fw-bold">Aperçu :</label>
                            <br>
                            <img th:src="${product.imageUrl}"
                                 th:alt="${product.name}"
                                 style="max-height:150px; max-width:100%;"
                                 class="rounded"
                                 onerror="this.src='https://via.placeholder.com/150x150?text=Image+non+trouvee'">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Enregistrer
                            </button>
                            <a href="/merchant/products" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Retour
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

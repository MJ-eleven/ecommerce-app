<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Formulaire variante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-store"></i> E-Shop Commerçant</a>
    </div>
</nav>

<div class="container my-4">
    <h1 class="mb-4">
            <span th:if="${variant.id == null}">
                <i class="fas fa-plus"></i> Ajouter une variante
            </span>
        <span th:if="${variant.id != null}">
                <i class="fas fa-edit"></i> Modifier la variante
            </span>
        <small class="text-muted">pour <span th:text="${product.name}">Produit</span></small>
    </h1>

    <div class="row">
        <div class="col-12 col-md-8 col-lg-6">
            <!-- 🔥 LE FORMULAIRE CHANGE SELON AJOUT OU MODIFICATION -->
            <form th:action="${variant.id == null ? '/merchant/variants/save' : '/merchant/variants/update/' + variant.id}"
                  method="post" class="card p-4">

                <input type="hidden" name="productId" th:value="${product.id}">

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Nom de la variante *</label>
                    <input type="text" class="form-control" id="name" name="name"
                           th:value="${variant.name}"
                           required placeholder="Ex: Bleu / M">
                </div>

                <div class="mb-3">
                    <label for="attribute1" class="form-label fw-bold">Attribut 1 (ex: Couleur) *</label>
                    <input type="text" class="form-control" id="attribute1" name="attribute1"
                           th:value="${variant.attribute1}"
                           required placeholder="Ex: Bleu">
                </div>

                <div class="mb-3">
                    <label for="attribute2" class="form-label fw-bold">Attribut 2 (ex: Taille)</label>
                    <input type="text" class="form-control" id="attribute2" name="attribute2"
                           th:value="${variant.attribute2}"
                           placeholder="Ex: M">
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label fw-bold">Prix *</label>
                    <input type="number" class="form-control" id="price" name="price"
                           th:value="${variant.price}"
                           step="0.01" min="0" required>
                </div>

                <div class="mb-3">
                    <label for="stockQuantity" class="form-label fw-bold">Stock *</label>
                    <input type="number" class="form-control" id="stockQuantity" name="stockQuantity"
                           th:value="${variant.stockQuantity}"
                           min="0" required>
                </div>

                <div class="mb-3">
                    <label for="sku" class="form-label fw-bold">SKU (Code unique) *</label>
                    <input type="text" class="form-control" id="sku" name="sku"
                           th:value="${variant.sku}"
                           required placeholder="Ex: TSHIRT-BLEU-M">
                </div>

                <div class="mb-3">
                    <label for="imageUrl" class="form-label fw-bold">
                        <i class="fas fa-image"></i> URL de l'image
                    </label>
                    <input type="url" class="form-control" id="imageUrl" name="imageUrl"
                           th:value="${variant.imageUrl}"
                           placeholder="https://images.unsplash.com/photo-...">
                    <small class="text-muted">Laissez vide pour utiliser l'image du produit</small>
                </div>

                <!-- 🔥 APERÇU DE L'IMAGE POUR LA MODIFICATION -->
                <div th:if="${variant.imageUrl != null and variant.imageUrl != ''}" class="mb-3">
                    <label class="form-label fw-bold">Aperçu :</label>
                    <br>
                    <img th:src="${variant.imageUrl}"
                         th:alt="${variant.name}"
                         style="max-height:100px; max-width:100%;"
                         class="rounded border">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                    <a th:href="@{/merchant/variants/product/{id}(id=${product.id})}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Retour
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
